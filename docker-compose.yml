version: '3.8'

services:
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: cybersentinel
      POSTGRES_PASSWORD: sentinel_password_2026!
      POSTGRES_DB: cybersentinel_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/migrations:/docker-entrypoint-initdb.d
    networks:
      - cyber-net
    ports:
      - "5432:5432"
  #  Go Backend
  api-gateway:
    build:
      context: ./backend
      dockerfile: cmd/Dockerfile
    ports:
      - "8080:8080"
    volumes:
      - ./evidence-vault:/app/evidence
      - ./analysis:/app/analysis
      - ./flows:/app/flows
      - ./secrets:/app/secrets
    networks:
      - cyber-net
    cap_add:
      - NET_ADMIN
      - NET_RAW
    environment:
      - ANALYZER_URL=http://target-web:5000
      - CYBERSENTINEL_KEY_DIR=/app/secrets
      - DATABASE_URL=postgres://cybersentinel:sentinel_password_2026!@db:5432/cybersentinel_db?sslmode=disable
    depends_on:
      - target-web
      - target-ssh
      - db
      - traffic-analyzer

  # Vulnerable Target
  target-web:
    build: ./lab-targets/web-vulnerable
    networks:
      - cyber-net

  traffic-analyzer:
    build: ./analysis
    volumes:
      - ./evidence-vault:/app/evidence
      - ./flows:/app/flows
    network_mode: "service:target-web"
    cap_add:
      - NET_ADMIN
      - NET_RAW
    environment:
      - CAPTURE_INTERFACE=eth0

  target-ssh:
    build: ./lab-targets/ssh-target
    networks:
      - cyber-net
      
volumes:
  postgres_data:

networks:
  cyber-net:
    driver: bridge
