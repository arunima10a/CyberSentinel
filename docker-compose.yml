version: '3.8'

services:
  #  Go Backend
  api-gateway:
    build:
      context: ./backend
      dockerfile: cmd/Dockerfile
    ports:
      - "8080:8080"
    volumes:
      - ./evidence-vault:/app/evidence
      - ./analysis:/app/analysis
      - ./flows:/app/flows
      - ./secrets:/app/secrets
    networks:
      - cyber-net
    cap_add:
      - NET_ADMIN
      - NET_RAW
    environment:
      - ANALYZER_URL=http://target-web:5000
      - CYBERSENTINEL_KEY_DIR=/app/secrets
    depends_on:
      - target-web
      - traffic-analyzer

  # Vulnerable Target
  target-web:
    build: ./lab-targets/web-vulnerable
    networks:
      - cyber-net

  traffic-analyzer:
    build: ./analysis
    volumes:
      - ./evidence-vault:/app/evidence
      - ./flows:/app/flows
    network_mode: "service:target-web"
    cap_add:
      - NET_ADMIN
      - NET_RAW
    environment:
      - CAPTURE_INTERFACE=eth0

  target-ssh:
    build: ./lab-targets/ssh-target
    networks:
      - cyber-net

networks:
  cyber-net:
    driver: bridge
