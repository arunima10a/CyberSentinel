version: '3.8'

services:
  #  Go Backend
  api-gateway:
    build:
      context: ./backend
      dockerfile: cmd/Dockerfile
    ports:
      - "8080:8080"
    networks:
      - cyber-net
    depends_on:
      - target-web

  # Vulnerable Target
  target-web:
    build: ./lab-targets/web-vulnerable
    networks:
      - cyber-net

networks:
  cyber-net:
    driver: bridge
